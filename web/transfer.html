<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>connection — graph files</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="transfer">
    <main id="transfer">
      <header>
        <h1>Graph files</h1>
        <a href="/">← map</a>
      </header>

      <!-- Downloads. These are buttons, not links. There is no URL to fetch: each one builds
           a blob in the page and hands it to the browser. -->
      <section class="sheet">
        <h2>Download</h2>
        <p class="note">
          The graph is in this browser and nowhere else. This is the only backup there is.
        </p>
        <div class="acts">
          <button class="act" id="out-joins" type="button">
            <b>Names &amp; joins</b><span>.txt · editable</span>
          </button>
          <button class="act" id="out-names" type="button">
            <b>Names only</b><span>.txt · no edges</span>
          </button>
          <button class="act" id="out-json" type="button">
            <b>Backup</b><span>.json · everything</span>
          </button>
        </div>
        <p id="downloaded"></p>
      </section>

      <section class="sheet">
        <h2>Add a text file</h2>

        <!-- The label is the drop target. The whole box takes a click, and the input inside
             it is hidden by CSS. -->
        <label id="drop" for="file">
          <input type="file" id="file" accept=".txt,text/plain" />
          <b id="drop-name">Drop a .txt file here</b>
          <span id="drop-hint">or click to choose</span>
          <!-- One example line, in place of a paragraph describing the format. -->
          <code>Kavara | Miselin | Vessarin</code>
        </label>

        <ul id="faults" hidden></ul>

        <div id="tally" hidden>
          <div><b id="n-nodes">0</b><span>new nodes</span></div>
          <div><b id="n-edges">0</b><span>new edges</span></div>
          <div><b id="n-known">0</b><span>already here</span></div>
        </div>

        <details id="detail" hidden>
          <summary>What it reads</summary>
          <div id="detail-body"></div>
        </details>

        <button class="act go" id="apply" type="button" hidden>Add to the graph</button>
        <p id="said"></p>
      </section>

      <!-- The actions that change the whole graph at once. On the command line these were
           guarded by an environment variable and a backup file written first. A button has
           neither, so the confirmation below is the guard. -->
      <section class="sheet">
        <h2>The whole graph</h2>
        <div class="acts">
          <label class="act" id="in-json-label" for="in-json">
            <input type="file" id="in-json" accept=".json,application/json" />
            <b>Import JSON</b><span>replaces the graph</span>
          </label>
          <button class="act" id="seed" type="button">
            <b>Seed a demo graph</b><span>replaces the graph</span>
          </button>
          <button class="act" id="check" type="button">
            <b>Check the graph</b><span>writes nothing</span>
          </button>
          <button class="act" id="recount" type="button">
            <b>Recount the islands</b><span>rebuilds the index</span>
          </button>
        </div>

        <!-- Shown before anything replaces the stored graph. It offers the backup download
             here, because someone who has to leave the page to take one will not take one. -->
        <div id="ask" hidden>
          <p id="ask-what"></p>
          <div class="acts">
            <button class="act" id="ask-save" type="button">
              <b>Download a backup</b><span>first</span>
            </button>
            <button class="act go" id="ask-yes" type="button"><b>Go ahead</b><span></span></button>
            <button class="act" id="ask-no" type="button"><b>Cancel</b><span></span></button>
          </div>
        </div>

        <ul id="report" hidden></ul>
        <p id="told"></p>
      </section>
    </main>

    <script type="module" src="/src/transfer.ts"></script>
  </body>
</html>
