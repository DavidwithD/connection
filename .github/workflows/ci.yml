# The gates, somewhere they cannot be skipped.
#
# The pre-commit hook runs the same two gates the same way, but it is per-clone,
# opt-in, and one `--no-verify` from silent.
#
# Nothing here reimplements a check. Every step is an npm script a contributor runs
# locally, so a red run is reproducible with one command and never means "CI has its
# own rules".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the running one pointless: it is testing a commit that is
# already history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: gates and build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Both versions get reported. Knowing only that "something failed" would mean
      # running it again to find out which.
      fail-fast: false
      matrix:
        # The floor `engines` declares, and the version development happens on. The
        # floor is the interesting one: it is a promise nothing exercises until
        # somebody actually holds a runtime to it.
        node: ["20.19", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run adr
      - run: npm run docs

      # The docs gate's own failure mode is silence, so the thing that proves it still
      # compares anything belongs where it cannot be skipped either. It is not on the
      # pre-commit hook: it copies the tree once per case, which is a second of work a
      # commit need not pay.
      - run: npm run docs:selftest

      # Bundling fails in ways typecheck cannot see, and it is the step most likely to be
      # the thing that objects to the older runtime. With `npm ci` above it, this covers the
      # install and every module going through Vite, on both runtimes.
      #
      # The README's getting-started is `npm install` and `npm run web`. Nothing here starts
      # a dev server or opens a page, so a getting-started broken in the browser breaks on
      # somebody's first morning.
      - run: npm run build
